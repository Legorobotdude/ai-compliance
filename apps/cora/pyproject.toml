[project]
name = "cora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Bawankule", email = "adityabawankule@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.3",
    "asyncpg>=0.29.0",
    "openai>=1.25.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0.post0",
    "orjson>=3.10.0",
    "boto3>=1.34.0",
    "pypdf>=4.2.0"
]

[project.scripts]
cora = "cora.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cora"]
