version: '3.9'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: certivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certivo
      POSTGRES_USER: certivo
      POSTGRES_PASSWORD: certivo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U certivo -d certivo']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certivo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '""', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
